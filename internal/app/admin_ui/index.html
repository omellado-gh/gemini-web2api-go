<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>gemini-web2api Panel de administración</title>
<!-- Chart.js va embebido en el binario, sin CDN: el panel debe abrirse también en despliegues en red interna o sin conexión -->
<script src="chart.umd.min.js"></script>
<style>
  /* ── Lenguaje de diseño de Gemini (tema claro)────────────────────────────────────────────
     Como gemini.google.com: la página es un blanco azulado (#F8FAFD) y las tarjetas son blanco puro **sin borde**;
     se separan por contraste del fondo y esquinas de 16px — bordearlo todo convertiría la página en un montón de cajas, lo menos parecido a
     lo que hace Gemini. La barra lateral comparte el color de la página y no tiene separadores; es plegable; el estado seleccionado es el de Material 3
     secondary-container (#D3E3FD) junto con #0B57D0.
     Los tres colores de marca (azul→morado→rosa) aparecen en un único lugar de todo el sitio: la pista de la línea roja de bloqueo. */
  :root {
    --g-blue: #4285F4;
    --g-purple: #9B72CB;
    --g-pink: #D96570;
    --g-sweep: linear-gradient(90deg, #4285F4 0%, #9B72CB 58%, #D96570 100%);

    --bg: #F8FAFD;
    --card: #FFFFFF;
    --surface-hi: #EFF3FA;
    --surface-press: #E2E8F1;
    --outline: #D5DAE1;
    --outline-soft: #E8ECF1;
    --nav-on: #D3E3FD;
    --nav-on-fg: #0B57D0;

    --text: #1F1F1F;
    --text-2: #3C4043;
    --muted: #5F6368;
    --ok: #146C2E;
    --ok-bg: #E6F4EA;
    --fail: #B3261E;
    --fail-bg: #FCEEEE;
    --warn: #8F5000;
    --warn-bg: #FDF0E0;

    --sb-w: 244px;
    --sb-w-collapsed: 72px;
    --topbar-h: 60px;
    --r-card: 16px;
    --r-pill: 999px;
    --sans: "Google Sans Text", "Google Sans", "Product Sans", -apple-system,
            BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC",
            "Microsoft YaHei", sans-serif;
    --mono: "Roboto Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
    --shadow: 0 1px 2px rgba(60,64,67,.06), 0 1px 3px 1px rgba(60,64,67,.05);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--sans); background: var(--bg); color: var(--text);
    font-size: 14px; line-height: 1.55; -webkit-font-smoothing: antialiased;
  }
  #app { display: flex; min-height: 100vh; }
  ::selection { background: var(--nav-on); }

  /* ── Barra lateral ───────────────────────────────────────────────────────────── */
  .sidebar {
    width: var(--sb-w); flex: 0 0 var(--sb-w); padding: 10px 12px 14px;
    display: flex; flex-direction: column;
    position: sticky; top: 0; height: 100vh;
    transition: width .2s cubic-bezier(.2,0,0,1), flex-basis .2s cubic-bezier(.2,0,0,1);
  }
  .sidebar.collapsed { width: var(--sb-w-collapsed); flex-basis: var(--sb-w-collapsed); }
  .side-top { display: flex; align-items: center; gap: 6px; height: var(--topbar-h); }
  .icon-btn {
    all: unset; cursor: pointer; width: 40px; height: 40px; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: var(--r-pill); color: var(--text-2); transition: background .15s;
  }
  .icon-btn:hover { background: var(--surface-press); }
  .icon-btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .brand-text {
    display: flex; align-items: center; gap: 9px; font-size: 15px;
    color: var(--text-2); white-space: nowrap; overflow: hidden;
  }
  .spark {
    width: 20px; height: 20px; flex: none; background: var(--g-sweep);
    clip-path: polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);
  }
  .sidebar.collapsed .brand-text { display: none; }

  .sidebar nav { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; }
  .sidebar nav button {
    all: unset; cursor: pointer; display: flex; align-items: center; gap: 14px;
    padding: 10px 16px; border-radius: var(--r-pill); color: var(--text-2);
    font-size: 14px; font-family: var(--sans); white-space: nowrap;
    transition: background .15s;
  }
  .sidebar nav button svg { width: 20px; height: 20px; flex: none; fill: currentColor; opacity: .75; }
  .sidebar nav button:hover { background: var(--surface-press); }
  .sidebar nav button.active { background: var(--nav-on); color: var(--nav-on-fg); font-weight: 500; }
  .sidebar nav button.active svg { opacity: 1; }
  .sidebar nav button:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .sidebar.collapsed nav button { justify-content: center; padding: 10px 0; }
  .sidebar.collapsed .nav-label { display: none; }

  .side-foot { margin-top: auto; padding: 12px 16px 2px; font-size: 12px; color: var(--muted); }
  .side-foot .sf-row { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; }
  .side-foot .sf-row b { color: var(--text-2); font-weight: 500; }
  .sf-sep { height: 1px; background: var(--outline-soft); margin: 9px 0; }
  .logout-btn {
    all: unset; box-sizing: border-box; cursor: pointer; width: 100%;
    display: flex; align-items: center; gap: 13px; padding: 9px 14px;
    border-radius: var(--r-pill); color: var(--muted); font-size: 13px;
    font-family: var(--sans); transition: background .15s, color .15s;
  }
  .logout-btn svg { width: 18px; height: 18px; flex: none; fill: currentColor; }
  .logout-btn:hover { background: var(--fail-bg); color: var(--fail); }
  .logout-btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  /* Al plegar se oculta la línea de estado, pero el botón de salir debe quedarse; de lo contrario, con la barra plegada no habría forma de cerrar sesión */
  .sidebar.collapsed .side-foot { padding: 12px 8px 2px; }
  .sidebar.collapsed #sideStat, .sidebar.collapsed .sf-sep { display: none; }
  .sidebar.collapsed .logout-btn { justify-content: center; padding: 9px 0; }

  /* ── Área de contenido ─────────────────────────────────────────────────────────── */
  .content { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar {
    height: var(--topbar-h); flex: none; display: flex; align-items: center;
    justify-content: space-between; gap: 16px; padding: 0 24px;
    position: sticky; top: 0; z-index: 10; background: var(--bg);
  }
  .page-title { font-size: 20px; font-weight: 400; letter-spacing: -.01em; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok);
         box-shadow: 0 0 0 3px rgba(20,108,46,.14); }
  .dot.bad { background: var(--fail); box-shadow: 0 0 0 3px rgba(179,38,30,.14); }

  main { flex: 1; padding: 4px 24px 36px; min-width: 0; }
  h2 {
    font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; min-height: 32px;
  }

  /* ── Tarjetas: blanco puro sin borde ───────────────────────────────────────────────── */
  .panel, .card {
    background: var(--card); border-radius: var(--r-card);
    padding: 20px 22px; margin-bottom: 14px; box-shadow: var(--shadow);
  }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .grid-main { display: grid; grid-template-columns: minmax(0,2fr) minmax(310px,1fr);
               gap: 14px; margin-bottom: 14px; align-items: start; }
  .grid-2 > *, .grid-main > * { margin-bottom: 0; }
  .stack { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
  .stack > * { margin-bottom: 0; }

  /* ── KPI ────────────────────────────────────────────────────────────── */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px,1fr));
             gap: 14px; margin-bottom: 14px; }
  .kpi { background: var(--card); border-radius: var(--r-card); padding: 15px 18px;
         box-shadow: var(--shadow); }
  .kpi .label { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
  .kpi .value { font-size: 27px; font-weight: 400; letter-spacing: -.02em;
                line-height: 1.2; color: var(--text); font-variant-numeric: tabular-nums; }
  .kpi .sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; }

  /* ── Tablas ───────────────────────────────────────────────────────────── */
  table { width: 100%; border-collapse: collapse; font-size: 13px; table-layout: fixed; }
  th { text-align: left; color: var(--muted); font-weight: 500; font-size: 12px;
       padding: 9px 10px; border-bottom: 1px solid var(--outline-soft); white-space: nowrap; }
  td { padding: 11px 10px; border-bottom: 1px solid var(--outline-soft);
       vertical-align: top; overflow-wrap: anywhere; }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: #F6F9FE; }
  tbody tr.row-dead { background: var(--fail-bg); box-shadow: inset 3px 0 0 var(--fail); }
  td.nw, th.nw { white-space: nowrap; overflow-wrap: normal; }
  td.num { font-variant-numeric: tabular-nums; }
  .empty { text-align: center; color: var(--muted); padding: 36px 0; }

  /* ── Botones ───────────────────────────────────────────────────────────── */
  .btn, .controls button, button.btn {
    /* all:unset restablece box-sizing a content-box (su prioridad es mayor que la del selector *),
       así que cualquier botón con width definido añade el ancho del padding lateral y desborda el contenedor.
       El botón a todo lo ancho de la pantalla de inicio de sesión es justo el que se sale de la tarjeta. */
    all: unset; box-sizing: border-box;
    cursor: pointer; font-family: var(--sans); font-size: 13px;
    padding: 8px 18px; border-radius: var(--r-pill); white-space: nowrap;
    background: var(--nav-on); color: var(--nav-on-fg); font-weight: 500;
    transition: background .15s;
  }
  .btn:hover { background: #C2D8FA; }
  .btn:focus-visible { outline: 2px solid var(--g-blue); outline-offset: 2px; }
  .btn.muted { background: var(--surface-hi); color: var(--text-2); font-weight: 400; }
  .btn.muted:hover { background: var(--surface-press); }
  .btn.danger { background: transparent; color: var(--fail); box-shadow: inset 0 0 0 1px var(--outline); }
  .btn.danger:hover { background: var(--fail-bg); }
  .btn[disabled] { opacity: .38; cursor: default; pointer-events: none; }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button { background: var(--surface-hi); color: var(--text-2);
                     font-weight: 400; padding: 7px 15px; }
  .controls button:hover { background: var(--surface-press); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; }

  select, input[type=text], input[type=password], input[type=number], textarea {
    font-family: var(--sans); font-size: 13px; color: var(--text);
    background: var(--surface-hi); border: 1px solid transparent;
    border-radius: 10px; padding: 8px 12px; outline: none; transition: border-color .15s;
  }
  textarea { width: 100%; font-family: var(--mono); font-size: 12px; resize: vertical; }
  select { cursor: pointer; }
  select:focus, input:focus, textarea:focus { border-color: var(--g-blue); background: var(--card); }

  /* ── Insignias ───────────────────────────────────────────────────────────── */
  .badge { display: inline-block; padding: 3px 10px; border-radius: var(--r-pill);
           font-size: 11.5px; line-height: 1.4; white-space: nowrap;
           background: var(--surface-hi); color: var(--muted); }
  .badge.ok { background: var(--ok-bg); color: var(--ok); }
  .badge.fail { background: var(--fail-bg); color: var(--fail); }
  .badge.warn { background: var(--warn-bg); color: var(--warn); }
  .badge.muted { background: var(--surface-hi); color: var(--muted); }

  .pre { font-family: var(--mono); font-size: 11.5px; white-space: pre-wrap; word-break: break-all; }
  .clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
            overflow: hidden; }
  code { font-family: var(--mono); font-size: 12px; background: var(--surface-hi);
         padding: 1px 6px; border-radius: 5px; }
  .muted { color: var(--muted); }
  .truncate { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint, .desc { color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  /* La frase descriptiva bajo el encabezado de la tarjeta usa siempre esta clase; ya no se escribe un estilo inline en cada sitio */
  .lede { color: var(--muted); font-size: 12.5px; line-height: 1.65; margin-bottom: 12px; }
  /* Tabla de clave-valor de solo lectura: sin encabezado, columna izquierda estrecha y sin salto de línea */
  table.kv td { padding: 9px 0; font-size: 12.5px; }
  table.kv td:first-child { width: 92px; color: var(--muted); white-space: nowrap;
                            padding-right: 12px; }
  .err { color: var(--fail); font-size: 13px; margin-top: 10px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .field { margin-bottom: 14px; }
  .field .label { display: block; margin-bottom: 6px; font-size: 13px; }
  /* Nota plegable: la interfaz de Gemini no acumula párrafos largos; los detalles se recogen aquí */
  details.note { margin-bottom: 12px; }
  details.note > summary { cursor: pointer; color: var(--nav-on-fg); font-size: 12.5px;
                           list-style: none; display: inline-flex; align-items: center; gap: 4px; }
  details.note > summary::-webkit-details-marker { display: none; }
  details.note > summary::after { content: "▾"; font-size: 10px; }
  details.note[open] > summary::after { content: "▴"; }
  details.note .body { color: var(--muted); font-size: 12.5px; line-height: 1.65;
                       margin-top: 8px; padding: 12px 14px; background: var(--bg);
                       border-radius: 12px; }

  /* ── Formulario de configuración en tiempo de ejecución ─────────────────────────────────────────────────
     Antes cada opción ocupaba una línea entera (etiqueta | campo | pista), así que 12 opciones eran 12 líneas con los dos tercios derechos vacíos,
     y la página llegaba a 2200px. Ahora se agrupa por semántica, con varias columnas adaptativas dentro de cada grupo y la etiqueta encima del campo. */
  .cfg-group { margin-bottom: 22px; }
  .cfg-group:last-of-type { margin-bottom: 0; }
  .cfg-group > h3 { font-size: 12px; font-weight: 500; color: var(--muted);
                    margin-bottom: 12px; padding-bottom: 7px;
                    border-bottom: 1px solid var(--outline-soft); }
  .cfg-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(186px, 1fr));
              gap: 16px 18px; }
  .cfg-item { min-width: 0; }
  .cfg-item > label { display: block; font-size: 12.5px; color: var(--text-2); margin-bottom: 6px; }
  .cfg-item input[type=text], .cfg-item input[type=number], .cfg-item select { width: 100%; }
  .cfg-item.wide { grid-column: 1 / -1; }
  .cfg-item.check { display: flex; align-items: center; gap: 10px;
                  margin-top: 25px; }  /* 25px = alto de línea de la etiqueta + margen inferior, para alinear con los campos de la misma fila */
  .cfg-item.check > label { margin: 0; }
  .cfg-item input[type=checkbox] { width: 18px; height: 18px; flex: none;
                                   accent-color: var(--nav-on-fg); }
  .rthint { color: var(--muted); font-size: 11.5px; line-height: 1.45; margin-top: 5px; }
  .cfg-item.check .rthint { margin: 0; }
  .cfg-actions { display: flex; gap: 8px; align-items: center; margin-top: 20px;
                 padding-top: 16px; border-top: 1px solid var(--outline-soft); }

  /* ── signature: distancia a la línea roja de bloqueo ─────────────────────────────────────────
     En pruebas, tras 80-180 peticiones desde una misma salida Google redirige a la página sorry; la pista toma el límite inferior de 80.
     Este intervalo es conocimiento propio de este proyecto y lo único a lo que de verdad hay que prestar atención en el despliegue; por eso es
     el protagonista del panel, situado en la columna derecha de la primera pantalla a la altura del gráfico de tendencia. El degradado de tres colores solo se usa en esta pista. */
  .slot { padding: 13px 0; border-bottom: 1px solid var(--outline-soft); }
  .slot:first-of-type { padding-top: 2px; }
  .slot:last-child { border-bottom: none; padding-bottom: 2px; }
  .slot-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .slot-name { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .slot-count { font-family: var(--mono); font-size: 11.5px; color: var(--muted);
                white-space: nowrap; font-variant-numeric: tabular-nums; }
  .slot-count b { color: var(--text); font-size: 15px; font-weight: 500; }
  .track { position: relative; height: 6px; border-radius: var(--r-pill);
           background: var(--surface-press); margin-top: 9px; overflow: hidden; }
  .track .fill { position: absolute; inset: 0 auto 0 0; border-radius: var(--r-pill);
                 background: var(--g-sweep); background-size: 300px 100%;
                 transition: width .45s cubic-bezier(.2,0,0,1); }
  .redline { position: absolute; top: -3px; bottom: -3px; width: 2px;
             background: var(--fail); opacity: .9; }
  .slot-note { margin-top: 7px; font-size: 11.5px; color: var(--muted); }
  .slot-note.warn { color: var(--warn); }
  .slot-note.danger { color: var(--fail); font-weight: 500; }
  .slot-scroll { max-height: 262px; overflow-y: auto; }

  /* ── Gráficos ───────────────────────────────────────────────────────────── */
  .chart-wrap { position: relative; height: 262px; width: 100%; }
  .chart-wrap canvas { position: absolute; inset: 0; width: 100% !important; height: 100% !important; }

  /* ── Lista de altura fija: llena el viewport y no la estiran los datos ───────────────────────────────── */
  .page-fill { display: flex; flex-direction: column;
               height: calc(100vh - var(--topbar-h) - 44px); margin-bottom: 0; }
  .table-scroll { flex: 1; min-height: 0; overflow: auto; }
  .table-scroll thead th { position: sticky; top: 0; z-index: 1; background: var(--card); }
  .pager { display: flex; align-items: center; justify-content: space-between;
           gap: 12px; padding-top: 14px; margin-top: 4px; flex-wrap: wrap;
           font-size: 13px; border-top: 1px solid var(--outline-soft); }
  .pager-btns { display: flex; align-items: center; gap: 6px; }

  /* ── Iniciar sesión ───────────────────────────────────────────────────────────── */
  /* align-self no se puede omitir: #app es un contenedor flex y, en estado de sesión, .login-box es el único hijo;
     por defecto align-items:stretch lo estira hasta la altura completa del contenedor (100vh menos los márgenes superior e inferior),
     y queda un gran hueco bajo la tarjeta. Aquí se deja a la altura del contenido, manteniendo el centrado horizontal con auto margin. */
  .login-box { align-self: flex-start; width: 372px; max-width: 92vw;
               margin: 16vh auto; background: var(--card);
               border-radius: 28px; padding: 34px 32px;
               box-shadow: 0 1px 3px rgba(60,64,67,.16), 0 8px 28px rgba(60,64,67,.1); }
  .login-box h1 { font-size: 19px; font-weight: 400; margin-bottom: 22px;
                  display: flex; align-items: center; gap: 10px; }
  .login-box input { width: 100%; margin-bottom: 14px; padding: 12px 15px; }
  .login-box .btn { width: 100%; text-align: center; background: var(--nav-on-fg); color: #fff; }
  .login-box .btn:hover { background: #0A4FBC; }

  /* ── Diálogos modales ───────────────────────────────────────────────────────────── */
  .modal-overlay { position: fixed; inset: 0; background: rgba(32,33,36,.45);
                   display: flex; align-items: center; justify-content: center; z-index: 50; }
  .modal { background: var(--card); border-radius: 28px; padding: 26px 28px;
           width: min(460px,92vw); box-shadow: 0 8px 32px rgba(60,64,67,.24); }
  .modal h3 { font-size: 17px; font-weight: 400; margin-bottom: 8px; }
  .modal-body { margin: 14px 0 18px; }
  .modal-err { color: var(--fail); font-size: 12.5px; margin-bottom: 10px; }

  /* ── Conmutador por segmentos (las dos formas de rellenar la importación de Cookie)────────────────────────────────
     Cada forma tiene su caso: la individual va bien para copiar de DevTools campo a campo, y la de cadena completa para cuando ya se tiene una
     cadena ya hecha "k=v; k=v". Se hace como pestañas y no como dos entradas porque al cambiar deben pasarse los datos entre sí
     — de lo contrario, cambiar de modo a medio rellenar haría perder lo escrito. */
  .segbar { display: inline-flex; background: var(--bg); border-radius: 999px;
            padding: 3px; gap: 2px; margin-bottom: 14px; }
  .segbar button { border: none; background: transparent; cursor: pointer;
                   font: inherit; font-size: 12.5px; color: var(--muted);
                   padding: 6px 14px; border-radius: 999px; transition: all .15s; }
  .segbar button.on { background: var(--card); color: var(--fg);
                      box-shadow: 0 1px 3px rgba(60,64,67,.16); }
  .ck-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
             gap: 10px 12px; }
  .ck-grid .field { margin-bottom: 0; }
  .ck-grid .field.wide { grid-column: 1 / -1; }
  .ck-grid label { display: block; font-size: 11.5px; color: var(--muted);
                   margin-bottom: 4px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .ck-grid label .req { color: var(--fail); }
  .ck-grid input { width: 100%; font-family: var(--mono); font-size: 12px;
                   text-overflow: ellipsis; }
  .ck-extra { font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.6; }
  /* El modo individual lista 7 campos; en pantallas estrechas no hay que reventar el diálogo modal */
  .modal.wide { width: min(620px, 94vw); }

  @media (max-width: 1100px) { .grid-main { grid-template-columns: 1fr; } }
  @media (max-width: 900px) {
    #app { flex-direction: column; }
    .sidebar, .sidebar.collapsed { width: 100%; flex-basis: auto; height: auto;
                                   position: static; padding: 8px 12px; }
    .side-top { height: 48px; }
    .sidebar nav { flex-direction: row; overflow-x: auto; margin-top: 2px; }
    .sidebar.collapsed nav button { padding: 10px 16px; }
    .sidebar.collapsed .nav-label { display: inline; }
    .side-foot { display: none; }
    .topbar { padding: 0 14px; }
    main { padding: 4px 14px 28px; }
    .grid-2 { grid-template-columns: 1fr; }
    .chart-wrap { height: 210px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
// El intervalo medido de cuántas peticiones aguanta una sola salida es 80-180; se toma el límite inferior como línea de referencia.
// No es una línea rígida: cuánto aguanta depende sobre todo de la reutilización de conexiones y de la calidad de la salida, y a ritmo suave casi nunca se agota.
const BAN_LINE = 80;

const api = async (path, opts = {}) => {
  const r = await fetch(path, { credentials: 'include', ...opts,
    headers: { 'Content-Type': 'application/json', ...(opts.headers || {}) } });
  if (r.status === 401) { renderLogin(); throw new Error('unauthorized'); }
  return r.json();
};

const fmt = {
  ts: (sec) => new Date(sec * 1000).toLocaleString('es', { hour12: false }),
  ms: (ms) => ms == null ? '-' : (ms < 1000 ? ms + 'ms' : (ms/1000).toFixed(2) + 's'),
  num: (n) => (n || 0).toLocaleString(),
  pct: (n) => (n * 100).toFixed(1) + '%',
};

let charts = {};
const destroyChart = (key) => { if (charts[key]) { charts[key].destroy(); delete charts[key]; } };

// ─── Pages ──────────────────────────────────────────────────────────────────

const pages = {
  dashboard: async () => {
    const stats = await api('api/stats?hours=24');
    const usage = await api('api/usage');
    return `
      <div class="kpi-row">
        <div class="kpi"><div class="label">Peticiones en 24 h</div><div class="value">${fmt.num(stats.total_requests)}</div></div>
        <div class="kpi"><div class="label">Tasa de éxito</div><div class="value">${fmt.pct(stats.success_rate)}</div>
          <div class="sub">${fmt.num(stats.success)} con éxito · ${fmt.num(stats.failures)} con fallos</div></div>
        <div class="kpi"><div class="label">Latencia media</div><div class="value">${fmt.ms(stats.avg_ms)}</div></div>
        <div class="kpi"><div class="label">Tokens de entrada</div><div class="value">${fmt.num(stats.prompt_tokens)}</div></div>
        <div class="kpi"><div class="label">Tokens de salida</div><div class="value">${fmt.num(stats.output_tokens)}</div></div>
      </div>

      <div class="grid-main">
        <div class="panel">
          <h2>Peticiones y latencia
            <span class="controls">
              <select id="rangeSel">
                <option value="24h">Últimas 24 horas</option>
                <option value="7d">Últimos 7 días</option>
                <option value="30d">Últimos 30 días</option>
              </select>
            </span>
          </h2>
          <div class="chart-wrap"><canvas id="chartReq"></canvas></div>
        </div>

        <div class="stack">
        <div class="panel">
          <h2>Distancia a la línea roja de bloqueo
            <span class="controls"><button onclick="refreshPage()">Actualizar</button></span>
          </h2>
          <div class="slot-scroll">
            ${(usage.items || []).map(u => {
              const rph = u.rph || 0;
              const limit = u.limit_rph || 0;
              const pct = Math.min(rph / BAN_LINE * 100, 100);
              const limitPct = limit ? Math.min(limit / BAN_LINE * 100, 100) : null;
              const left = Math.max(BAN_LINE - rph, 0);
              let noteCls = '', note = `Aún quedan unas ${left} peticiones`;
              if (rph >= BAN_LINE) { noteCls = 'danger'; note = 'Se superó la línea roja; puede bloquearse en cualquier momento'; }
              else if (rph >= BAN_LINE * 0.75) { noteCls = 'warn'; note = `Cerca de la línea roja, quedan solo unas ${left} peticiones`; }
              else if (rph === 0) { note = 'Sin peticiones en esta hora'; }
              return `<div class="slot">
                <div class="slot-head">
                  <span class="slot-name">${escapeHtml(u.name)}</span>
                  <span class="slot-count"><b>${rph}</b> / ${BAN_LINE}</span>
                </div>
                <div class="track">
                  <div class="fill" style="width:${pct}%"></div>
                  ${limitPct !== null ? `<div class="redline" style="left:${limitPct}%"
                    title="Límite local de RPH ${limit}"></div>` : ''}
                </div>
                <div class="slot-note ${noteCls}">${note} · Concurrentes ${u.inflight}/${u.limit_concurrent || '∞'}
                  · RPM ${u.rpm}/${u.limit_rpm || '∞'} · RPH ${rph}/${u.limit_rph || '∞'}</div>
              </div>`;
            }).join('') || '<div class="empty">Todavía no ha pasado ninguna petición</div>'}
          </div>
          <details class="note" style="margin:12px 0 0">
            <summary>De dónde sale esta línea</summary>
            <div class="body">
              En pruebas, tras <b>80-180 peticiones</b> desde una sola salida, Google redirige a <code>sorry/index</code>;
              la pista toma el <b>límite inferior</b> de ese intervalo. El intervalo es tan amplio porque lo determinan sobre todo la estrategia de conexión y la calidad de la salida
              (con la misma concurrencia de 10, reutilizar el pool de conexiones llega a 172/177, mientras que abrir una conexión nueva cada vez solo llega a 106/109);
              en una IP estática se llegó a 188.<br><br>
              <b>No es una línea rígida.</b> Lo que importa es el ritmo: a 10 peticiones por minuto, de forma suave, se encadenaron 800 peticiones
              a lo largo de 110 minutos sin que lo bloquearan ni una vez. Por eso esta pista es una referencia conservadora, no un "en cuanto llegues, se cae".<br><br>
              El bloqueo posterior es duro (60 sondeos sin ningún éxito en los 20 minutos siguientes), y se recupera solo a los 106-121 minutos.
              La línea vertical roja marca la posición del límite local de RPH; al superarlo se devuelve 429 directamente sin consumir cuota de Google.
              Para ampliar la capacidad, añade proxies en «Pool de proxies»; cada proxy es un slot independiente.
            </div>
          </details>
        </div>

        <div class="panel">
          <h2>Diagnóstico de conectividad
            <span class="controls"><button class="btn" onclick="runTest()">Probar una vez</button></span>
          </h2>
          <select id="testProxy" style="width:100%">
            <option value="">Selección automática (según las reglas de planificación)</option>
            <option value="0">Directo (IP del host)</option>
          </select>
          <p class="hint" style="margin-top:10px">
            Lanza una petición real para ver si pasa. No consume cuota de limitación ni escribe un registro de petición.
            Devolver 302/429 significa que la salida entró en la lista negra y toca cambiar de IP.
          </p>
          <div id="testResult" style="display:none; margin-top:12px;"></div>
        </div>
        </div>
      </div>

      <div class="grid-2">
        <div class="panel">
          <h2>Agrupado por modelo</h2>
          <table>
            <colgroup><col style="width:38%"><col style="width:14%"><col style="width:14%"><col style="width:16%"><col style="width:18%"></colgroup>
            <thead><tr><th>Modelo</th><th class="nw">Peticiones</th><th class="nw">Éxito</th><th class="nw">Media</th><th class="nw">Token</th></tr></thead>
            <tbody>${(stats.by_model || []).map(m => `
              <tr><td class="truncate" title="${escapeHtml(m.model)}">${m.model}</td>
                  <td class="num nw">${fmt.num(m.requests)}</td>
                  <td class="num nw">${fmt.num(m.success)}</td>
                  <td class="num nw">${fmt.ms(m.avg_ms)}</td>
                  <td class="num nw">${fmt.num(m.prompt_tokens + m.output_tokens)}</td></tr>`).join('')
              || '<tr><td colspan="5" class="empty">Sin datos</td></tr>'}
            </tbody>
          </table>
        </div>
        <div class="panel">
          <h2>Agrupado por salida</h2>
          <table>
            <colgroup><col style="width:46%"><col style="width:18%"><col style="width:18%"><col style="width:18%"></colgroup>
            <thead><tr><th>Salida</th><th class="nw">Peticiones</th><th class="nw">Éxito</th><th class="nw">Media</th></tr></thead>
            <tbody>${(stats.by_proxy || []).map(p => `
              <tr><td class="truncate">${!p.proxy || p.proxy === '(direct)' ? 'Directo' : escapeHtml(p.proxy)}</td>
                  <td class="num nw">${fmt.num(p.requests)}</td>
                  <td class="num nw">${fmt.num(p.success)}</td>
                  <td class="num nw">${fmt.ms(p.avg_ms)}</td></tr>`).join('')
              || '<tr><td colspan="4" class="empty">Sin datos</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>

      <div class="panel">
          <h2>Clasificación de errores (últimas ${stats.window_hours || 24} h)</h2>
          <table>
            <colgroup><col style="width:22%"><col style="width:10%"><col style="width:68%"></colgroup>
            <thead><tr><th>Tipo</th><th class="nw">Veces</th><th>Significado / qué hacer</th></tr></thead>
            <tbody>
              ${(stats.error_breakdown || []).map(e => `<tr>
                <td class="nw"><span class="badge ${ERR_BADGE[e.kind] || 'muted'}">${escapeHtml(e.kind)}</span></td>
                <td class="num nw">${e.count}</td>
                <td style="font-size:12.5px">${ERR_DESC[e.kind] || ''}
                  <div class="pre" style="margin-top:5px;color:var(--muted)">${escapeHtml(e.sample || '')}</div></td>
              </tr>`).join('') || '<tr><td colspan="3" class="empty">Sin fallos en esta ventana</td></tr>'}
            </tbody>
          </table>
      </div>
    `;
  },

  requests: async () => {
    return `
      <div class="panel page-fill">
        <h2>Registro de peticiones
          <span class="controls">
            <select id="reqStatus">
              <option value="">Todas</option>
              <option value="ok">Éxito</option>
              <option value="fail">Fallo</option>
            </select>
            <select id="reqModel"><option value="">Todos los modelos</option></select>
            <select id="reqSize">
              <option value="25">25 por página</option>
              <option value="50" selected>50 por página</option>
              <option value="100">100 por página</option>
              <option value="200">200 por página</option>
            </select>
            <button onclick="loadReqs()">Actualizar</button>
          </span>
        </h2>
        <div class="table-scroll">
          <table id="reqTable">
            <colgroup>
              <col style="width:140px"><col style="width:150px"><col style="width:130px">
              <col style="width:96px"><col style="width:70px"><col style="width:84px">
              <col style="width:84px"><col style="width:110px"><col style="width:64px">
              <col style="width:64px"><col>
            </colgroup>
            <thead><tr>
              <th class="nw">Hora</th><th class="nw">Modelo</th><th class="nw">Modelo real</th>
              <th class="nw">Salida</th><th class="nw">Cuenta</th><th class="nw">Estado</th>
              <th class="nw">TTFB</th><th class="nw">Tiempo total</th>
              <th class="nw">Entrada</th><th class="nw">Salida</th><th>Endpoint</th>
            </tr></thead>
            <tbody><tr><td colspan="11" class="empty">Cargando...</td></tr></tbody>
          </table>
        </div>
        <div class="pager" id="reqPager"></div>
      </div>
    `;
  },

  proxies: async () => {
    const data = await api('api/proxies');
    return `
      <div class="panel page-fill">
        <h2>Pool de proxies
          <span class="controls"><button class="btn" onclick="addProxy()">+ Añadir proxy</button></span>
        </h2>
        <details class="note">
          <summary>Cada proxy es un slot de IP independiente</summary>
          <div class="body">
            Cada proxy tiene su propia cuota de concurrencia / RPM / RPH; <b>cuantos más proxies configures, más crece la capacidad total de forma lineal</b>.
            Las peticiones buscan solas un proxy con hueco libre; si todos están llenos devuelve HTTP 429. Tras 5 fallos se abre el circuito automáticamente
            y «Restablecer» lo recupera a mano.<br><br>
            Atención: con al menos un proxy configurado, <b>por defecto ya no se vuelve a la conexión directa</b>, para evitar que al llenarse los proxies se sature también la IP del host;
            si priorizas la disponibilidad puedes activar «Volver a conexión directa cuando no haya proxy disponible» en la página «Ajustes». Un proxy con el circuito abierto descansa por defecto
            120 minutos y vuelve solo al pool (una salida bloqueada en pruebas se recupera sola a los 106-121 minutos); también se puede restablecer aquí a mano.
            En pruebas, una sola salida es bloqueada por Google tras 80-180 peticiones, así que ampliar capacidad solo depende de añadir salidas.
          </div>
        </details>
        <div class="table-scroll">
          <table>
            <colgroup>
              <col style="width:56px"><col style="width:150px"><col>
              <col style="width:88px"><col style="width:80px"><col style="width:200px">
              <col style="width:186px">
            </colgroup>
            <thead><tr>
              <th class="nw">ID</th><th class="nw">Nombre</th><th>URL del proxy</th><th class="nw">Estado</th>
              <th class="nw">Fallo</th><th class="nw">Último error</th><th class="nw">Acciones</th>
            </tr></thead>
            <tbody>${(data.items || []).map(p => `
              <tr>
                <td class="num nw">${p.id}</td>
                <td class="truncate" title="${escapeHtml(p.name)}">${escapeHtml(p.name)}</td>
                <td class="pre truncate" title="${escapeHtml(p.url)}">${escapeHtml(p.url)}</td>
                <td class="nw">${p.enabled ? '<span class="badge ok">Activado</span>' : '<span class="badge muted">Desactivado</span>'}</td>
                <td class="num nw">${p.fail_count > 0 ? '<span class="badge fail">' + p.fail_count + '</span>' : p.fail_count}</td>
                <td class="pre truncate" title="${escapeHtml(p.last_error || '')}">${escapeHtml(p.last_error || '—')}</td>
                <td class="nw">
                  <span class="actions">
                    <button class="btn muted" onclick="toggleProxy(${p.id})">${p.enabled ? 'Desactivar' : 'Activar'}</button>
                    <button class="btn muted" onclick="resetProxy(${p.id})">Restablecer</button>
                    <button class="btn danger" onclick="delProxy(${p.id})">Eliminar</button>
                  </span>
                </td>
              </tr>`).join('') || '<tr><td colspan="7" class="empty">Aún no hay proxies. Pulsa «+ Añadir proxy» para añadir uno.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  },

  cookies: async () => {
    const data = await api('api/cookies');
    const items = data.items || [];
    const deadN = items.filter(a => a.health === 'dead').length;
    return `
      <div class="panel page-fill">
        <h2>Pool de cookies
          <span class="controls">
            ${deadN > 0 ? '<span class="badge fail" style="margin-right:8px" title="Estas cuentas fallan la autenticación; probablemente la cookie caducó, conviene volver a exportarla con Firefox">' + deadN + ' Posiblemente inválida</span>' : ''}
            <span class="badge ${data.enabled > 0 ? 'ok' : 'muted'}" style="margin-right:8px">${data.enabled || 0} activos / ${data.total || 0} en total</span>
            <button class="btn" onclick="addCookieAcct()">+ Importar Cookie</button>
          </span>
        </h2>
        <details class="note">
          <summary>Una cuenta de Google con sesión por fila</summary>
          <div class="body">
            Pega la <b>cadena de cookie completa</b> de gemini.google.com (que contenga al menos SID / HSID / SSID /
            APISID / SAPISID / __Secure-1PSID / __Secure-1PSIDTS). Al hacer peticiones se rota automáticamente dando <b>prioridad a la que lleva más tiempo sin usarse</b> y se elige
            una cuenta activa; la generación de medios tiene una cuota de 10/día por cuenta, y cuantas más cuentas, mayor la capacidad total.<br><br>
            Tras guardarse, la credencial <b>ya no se devuelve al navegador</b>; la lista solo muestra un resumen desensibilizado (nº de cookies / campos clave /
            los últimos 4 dígitos de SAPISID / número de fallos). Las cuentas sin <code>__Secure-1PSIDTS</code> se marcan en amarillo
            y el primer keep-alive intentará reemitirlo ante Google; si falla repetidamente, vuelve a exportarla con <b>Firefox</b>
            (la sesión vinculada al dispositivo de las versiones nuevas de Chrome no se puede renovar).
          </div>
        </details>
        <div class="table-scroll">
          <table>
            <colgroup>
              <col style="width:48px"><col style="width:160px"><col style="width:80px">
              <col style="width:150px"><col style="width:92px"><col style="width:64px">
              <col style="width:150px"><col><col style="width:150px">
            </colgroup>
            <thead><tr>
              <th class="nw">ID</th><th class="nw">Etiqueta</th><th class="nw">Estado</th>
              <th class="nw">Cookies clave</th><th class="nw">SAPISID</th><th class="nw">Fallo</th>
              <th class="nw">Último éxito</th><th>Último error</th><th class="nw">Acciones</th>
            </tr></thead>
            <tbody>${items.map(a => `
              <tr class="${a.health === 'dead' ? 'row-dead' : ''}">
                <td class="num nw">${a.id}</td>
                <td class="truncate" title="${escapeHtml(a.label || '')}">${a.label ? escapeHtml(a.label) : '<span class="badge muted">Sin nombre</span>'}</td>
                <td class="nw">${
                  a.health === 'dead' ? '<span class="badge fail" title="la autenticación falla; probablemente la cookie caducó, conviene volver a exportarla con Firefox">Posiblemente inválida</span>'
                  : a.health === 'disabled' ? '<span class="badge muted">Desactivar</span>'
                  : a.health === 'unknown' ? '<span class="badge warn" title="Aún no se ha usado con éxito; pulsa «Comprobar» para confirmar">Pendiente de comprobación</span>'
                  : '<span class="badge ok">Correcto</span>'
                }</td>
                <td class="nw" title="En total ${a.cookie_count} cookies, campos clave:${(a.key_cookies||[]).join(' / ')}">
                  <span class="badge ${a.has_1psidts ? 'ok' : 'warn'}">${(a.key_cookies||[]).length}/7 campos</span>
                  ${a.has_1psidts ? '' : '<span class="badge warn" title="Falta __Secure-1PSIDTS; el primer keep-alive intentará reemitirlo; si falla, vuelve a exportarlo con Firefox">Falta TS</span>'}
                </td>
                <td class="pre nw">${a.sapisid_tail ? '…' + escapeHtml(a.sapisid_tail) : '—'}</td>
                <td class="num nw">${a.fail_count > 0 ? '<span class="badge fail">' + a.fail_count + '</span>' : 0}</td>
                <td class="nw" style="font-size:12px;color:var(--muted)">${a.last_ok_at ? fmt.ts(a.last_ok_at) : '—'}</td>
                <td class="pre truncate" title="${escapeHtml(a.last_error || '')}">${escapeHtml(a.last_error || '—')}</td>
                <td class="nw">
                  <span class="actions">
                    <button class="btn muted" onclick="checkCookieAcct(${a.id}, this)">Comprobar</button>
                    <button class="btn muted" onclick="rotateCookieAcct(${a.id}, this)">Keep-alive</button>
                    <button class="btn muted" onclick="toggleCookieAcct(${a.id})">${a.status === 'enabled' ? 'Desactivar' : 'Activar'}</button>
                    <button class="btn muted" onclick="editCookieAcct(${a.id}, ${JSON.stringify(a.label || '').replace(/"/g, '&quot;')}, ${JSON.stringify(a.note || '').replace(/"/g, '&quot;')})">Editar</button>
                    <button class="btn danger" onclick="delCookieAcct(${a.id})">Eliminar</button>
                  </span>
                </td>
              </tr>`).join('') || '<tr><td colspan="9" class="empty">El pool de cookies está vacío. Pulsa «+ Importar Cookie» para añadir una cuenta con sesión.</td></tr>'}
            </tbody>
          </table>
        </div>
      </div>
    `;
  },

  settings: async () => {
    const k = await api('api/apikey');
    return `
      <div class="grid-main">
        <div class="panel">
          <h2>Configuración en tiempo de ejecución</h2>
          <p class="lede">
            Tras cambiarla, pulsa guardar y <b>surte efecto de inmediato</b>, sin reiniciar. Se guarda en la base de datos y tiene prioridad sobre

              y no se convierten en un formulario web; las credenciales tampoco deberían pasar por el navegador.
            </p>
            <table id="deployTable" class="kv">
              <tbody></tbody>
            </table>
            <p class="lede" style="margin:14px 0 0;">
              gemini-web2api-go · binario único · SQLite · huella de Chrome 146 · facturación tiktoken cl100k_base
            </p>
          </div>
        </div>
      </div>
    `;
  },
};

// ─── Charts + handlers ──────────────────────────────────────────────────────

async function loadChart(range = '24h') {
  destroyChart('req');
  const data = await api('api/timeseries?range=' + range);
  const labels = (data.series || []).map(s => fmt.ts(s.bucket));
  const reqs = (data.series || []).map(s => s.requests);
  const p50 = (data.series || []).map(s => s.p50_ms);
  const ctx = document.getElementById('chartReq');
  if (!ctx) return;
  const g = ctx.getContext('2d');
  const areaBlue = g.createLinearGradient(0, 0, 0, 260);
  areaBlue.addColorStop(0, 'rgba(66,133,244,.22)');
  areaBlue.addColorStop(1, 'rgba(66,133,244,0)');

let reqOffset = 0;
// El número por página lo decide el desplegable «N por página»; si la página aún no se ha renderizado, se vuelve a 50
function reqPageSize() {
  const el = document.getElementById('reqSize');
  return el ? parseInt(el.value, 10) : 50;
}
async function loadReqs() {
  const status = document.getElementById('reqStatus')?.value || '';
  const model = document.getElementById('reqModel')?.value || '';
  const url = `api/requests?limit=${reqPageSize()}&offset=${reqOffset}` +
              (status ? '&status=' + status : '') +
              (model ? '&model=' + encodeURIComponent(model) : '');
  const data = await api(url);
  const tbody = document.querySelector('#reqTable tbody');
  if (!tbody) return;
  tbody.innerHTML = (data.items || []).map(r => `
    <tr>
      <td class="nw muted">${fmt.ts(r.ts)}</td>
      <td class="truncate" title="${escapeHtml(r.model)}">${escapeHtml(r.model)}</td>
      <td class="nw">${upstreamCell(r)}</td>
      <td class="nw truncate">${r.proxy_name ? escapeHtml(r.proxy_name) : '<span class="badge muted">Directo</span>'}</td>
      <td class="nw truncate" title="${escapeHtml(r.account_label || '')}">${
        r.account_id ? escapeHtml(r.account_label || ('#' + r.account_id))
                     : '<span class="badge muted">Anónimo</span>'}</td>
      <td class="nw">${r.status === 200 ? '<span class="badge ok">200</span>' : '<span class="badge fail">' + r.status + '</span>'}</td>
      <td class="num nw">${fmt.ms(r.ttfb_ms)}</td>
      <td class="num nw">${fmt.ms(r.total_ms)}</td>
      <td class="num nw">${fmt.num(r.prompt_tokens)}</td>
      <td class="num nw">${fmt.num(r.output_tokens)}</td>
      <td><span class="pre">${escapeHtml(r.endpoint)}${r.stream ? ' <span class="badge muted">stream</span>' : ''}</span>
        ${r.error ? '<div class="pre clamp2" style="color:var(--fail);margin-top:4px" title="'
          + escapeHtml(r.error) + '"><b>Error: </b>' + escapeHtml(r.error) + '</div>' : ''}
      </td>
    </tr>`).join('') || '<tr><td colspan="11" class="empty">Aún no hay registros de peticiones</td></tr>';
  const size = reqPageSize();
  const total = data.total || 0;
  const page = Math.floor(reqOffset / size) + 1;
  const pages = Math.max(Math.ceil(total / size), 1);
  const from = total ? reqOffset + 1 : 0;
  const to = Math.min(reqOffset + size, total);
  document.getElementById('reqPager').innerHTML = `
    <span class="muted">${from}-${to} / de ${total}</span>
    <span class="pager-btns">
      <button class="btn muted" ${reqOffset === 0 ? 'disabled' : ''}
        onclick="reqOffset=0;loadReqs()">Primera</button>
      <button class="btn muted" ${reqOffset === 0 ? 'disabled' : ''}
        onclick="reqOffset=Math.max(0,reqOffset-${size});loadReqs()">Anterior</button>
      <span class="muted" style="min-width:80px;text-align:center">Página ${page} / ${pages}</span>
      <button class="btn muted" ${to >= total ? 'disabled' : ''}
        onclick="reqOffset+=${size};loadReqs()">Siguiente</button>
      <button class="btn muted" ${to >= total ? 'disabled' : ''}
        onclick="reqOffset=${(pages-1)*size};loadReqs()">Última</button>
    </span>
  `;
  // populate model dropdown from current page (best-effort)
  const sel = document.getElementById('reqModel');
  if (sel && sel.options.length === 1) {
    const seen = new Set();
    (data.items || []).forEach(r => seen.add(r.model));
    [...seen].forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.text = m; sel.appendChild(opt);
    });
  }
}

async function saveRtCfg() {
  const msg = document.getElementById('rtCfgMsg');
  const body = {};
  for (const f of RT_GROUPS.flatMap(g => g.fields)) {
    const el = document.getElementById('rt_' + f.k);
    if (!el) continue;
    body[f.k] = f.type === 'bool' ? el.checked
      : f.type === 'int' ? parseInt(el.value, 10)
      : el.value.trim();
  }
  msg.textContent = 'Guardando…'; msg.style.color = 'var(--muted)';
  const res = await fetch('api/config', {
    method: 'PUT', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    msg.textContent = 'Fallo al guardar: ' + (data.error || res.status);
    msg.style.color = 'var(--fail)';
    return;
  }
  rtCfgCache = data.config;
  msg.textContent = 'Guardado y aplicado';
  msg.style.color = 'var(--ok)';
  setTimeout(() => { msg.textContent = ''; }, 3000);
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// El servidor degrada en silencio (por ejemplo, se pide 3.1 Pro y en realidad da 3.6 Flash); mirando solo el nombre de la petición no se detecta.
// upstream_model se toma del nombre visible que el servidor declara en el frame de respuesta; si no coincide con el de la petición, se marca en amarillo.
//
// Excepción con los modelos multimedia: el nombre de backend de imagen/música (Nano Banana / Lyria) ya es distinto del de la petición; es un mapeo
// esperado y no una degradación — un fallo real daría error directamente sin dejar un registro 200, así que aquí se tratan como "coincidentes" para no marcarlos en amarillo por error.
const upstreamExpected = { image: 'nanobanana', music: 'lyria' };
function upstreamCell(r) {
  const up = r.upstream_model || '';
  if (!up) return '<span class="badge muted">—</span>';
  const norm = t => (t || '').toLowerCase().replace(/[\s._-]/g, '').replace(/^gemini/, '');
  const nm = norm(r.model), nu = norm(up);
  const same = nu.startsWith(nm.slice(0, 6)) ||
               (upstreamExpected[nm] && nu.startsWith(upstreamExpected[nm]));
  return same
    ? escapeHtml(up)
    : '<span class="badge warn" title="El modelo que usa realmente el servidor difiere del solicitado">'
      + escapeHtml(up) + '</span>';
}

// Pool de cookies ────────────────────────────────────────────────────────────────

// Cookies que lista el modo individual. El orden sigue la "facilidad de encontrarlas en DevTools", no el alfabético.
// req marca solo SAPISID: el backend también obliga solo a este campo (hay que usarlo para calcular la cabecera de autorización SAPISIDHASH),
// los demás, si faltan, no necesariamente impiden usarla; marcarlos como obligatorios dejaría fuera cuentas que sí sirven.
const COOKIE_KEYS = [
  { k: '__Secure-1PSID', hint: 'Sesión principal' },
  { k: 'SAPISID', req: true, hint: 'Se usa para calcular la cabecera de autorización; si falta, se trata como anónimo' },
  { k: '__Secure-1PSIDTS', hint: 'Caduca en unos 30 minutos; el keep-alive lo renueva automáticamente' },
  { k: 'SID' }, { k: 'HSID' }, { k: 'SSID' }, { k: 'APISID' },
];

// Divide "k=v; k=v" en un objeto. El valor puede contener '=' (relleno base64), así que solo se corta en el primer signo igual.
function parseCookieStr(s) {
  const out = {};
  (s || '').split(';').forEach(p => {
    const t = p.trim();
    const i = t.indexOf('=');
    if (i > 0) out[t.slice(0, i)] = t.slice(i + 1);
  });
  return out;
}

function joinCookieObj(obj) {
  return Object.entries(obj).filter(([, v]) => (v || '').trim())
    .map(([k, v]) => `${k}=${String(v).trim()}`).join('; ');
}

  // Ambos modos comparten este estado y se pasan los datos al cambiar de pestaña. extras guarda lo que no está en
  // COOKIE_KEYS; la cookie pegada como cadena completa suele traer un montón de cosas más,
  // y no se pueden perder al cambiar a individual y volver.
  let extras = {};

  const data = await buildModal({
    title: 'Importar Cookie',
    wide: true,
    desc: 'En el navegador, F12 → Application → Cookies → elige <code>https://gemini.google.com</code>. Puedes copiar campo a campo o pegar la cadena completa; las dos formas se pueden cambiar en cualquier momento y lo ya rellenado se conserva.',
    bodyHTML: `
      <div class="field">
        <label>Etiqueta</label>
        <input data-name="label" type="text" placeholder="p. ej. el correo de la cuenta; opcional" />
        <div class="hint">Solo sirve para distinguir cuentas en el panel; no participa en las peticiones.</div>
      </div>

      <div class="segbar" data-role="seg">
        <button type="button" data-mode="raw" class="on">Pegar cadena completa (recomendado)</button>
        <button type="button" data-mode="fields">Rellenar campo a campo</button>
      </div>

      <div data-pane="fields" style="display:none;">
        <div class="ck-grid">
          ${COOKIE_KEYS.map(c => `
            <div class="field${c.k.length > 12 ? ' wide' : ''}">
              <label>${escapeHtml(c.k)}${c.req ? ' <span class="req">*</span>' : ''}</label>
              <input data-ck="${escapeHtml(c.k)}" type="text" autocomplete="off" spellcheck="false"
                     placeholder="${escapeHtml(c.hint || '')}" />
            </div>`).join('')}
        </div>
        <div class="ck-extra" data-role="extras"></div>
        <div class="ck-extra">Los tres primeros campos forman el conjunto mínimo viable en la práctica de proyectos similares; los cuatro de abajo lo completan para mayor estabilidad.
        Al capturar tráfico se midió que el navegador envía de verdad <b>más de 20</b> cookies cada vez, y nosotros reenviamos la cadena tal cual
        (en el código solo se analiza SAPISID para calcular la cabecera de autorización), por lo que
        <b>pegar la cadena completa se acerca más al navegador real</b>; el modo individual va bien cuando solo tienes unos pocos campos sueltos.</div>
      </div>

      <div data-pane="raw">
        <div class="field">
          <textarea data-name="cookie" rows="6" spellcheck="false"
            placeholder="SID=...; HSID=...; SSID=...; APISID=...; SAPISID=...; __Secure-1PSID=...; __Secure-1PSIDTS=..."></textarea>
          <div class="hint">Pega la línea completa, separada por puntos y comas. Debe contener al menos SAPISID y __Secure-1PSID.
          Conviene exportarla con Firefox (la sesión de las versiones nuevas de Chrome va ligada al dispositivo y no se renueva). En DevTools basta con seleccionar todo y copiar;
          los elementos sobrantes también se conservan — cuanto más completa, más se parece a un navegador real.</div>
        </div>
      </div>

      <div class="field" style="margin-top:14px;">
        <label>Nota</label>
        <input data-name="note" type="text" placeholder="Opcional" />
      </div>`,
    submitText: 'Importar',
    onReady: (overlay) => {
      const $ = (s) => overlay.querySelector(s);
      const inputs = () => [...overlay.querySelectorAll('[data-ck]')];
      const ta = $('[data-name=cookie]');

      const fieldsToRaw = () => {
        const obj = {};
        inputs().forEach(el => { if (el.value.trim()) obj[el.dataset.ck] = el.value.trim(); });
        ta.value = joinCookieObj({ ...obj, ...extras });
      };
      const rawToFields = () => {
        const obj = parseCookieStr(ta.value);
        const known = new Set(COOKIE_KEYS.map(c => c.k));
        extras = {};
        Object.entries(obj).forEach(([k, v]) => { if (!known.has(k)) extras[k] = v; });
        inputs().forEach(el => { el.value = obj[el.dataset.ck] || ''; });
        const n = Object.keys(extras).length;
        $('[data-role=extras]').textContent = n
          ? `Hay ${n} campos más no listados arriba (${Object.keys(extras).slice(0, 4).join(', ')}${n > 4 ? ' …' : ''}); se conservarán igualmente.`
          : '';
      };

      overlay.querySelectorAll('[data-role=seg] button').forEach(btn => {
        btn.onclick = () => {
          const mode = btn.dataset.mode;
          if (mode === 'raw') fieldsToRaw(); else rawToFields();
          overlay.querySelectorAll('[data-role=seg] button')
            .forEach(b => b.classList.toggle('on', b === btn));
          $('[data-pane=fields]').style.display = mode === 'fields' ? '' : 'none';
          $('[data-pane=raw]').style.display = mode === 'raw' ? '' : 'none';
        };
      });
      // Al pegar directamente una cadena completa en el modo individual se separa sola, para no obligar al usuario a cambiar de pestaña antes
      inputs().forEach(el => el.addEventListener('paste', (ev) => {
        const txt = (ev.clipboardData || window.clipboardData).getData('text') || '';
        if (!txt.includes(';') || !txt.includes('=')) return;
        ev.preventDefault();
        ta.value = txt.trim();
        rawToFields();
      }));
    },
    onSubmit: (overlay) => {
      const label = (overlay.querySelector('[data-name=label]').value || '').trim();
      const note = (overlay.querySelector('[data-name=note]').value || '').trim();
      const isRaw = overlay.querySelector('[data-role=seg] button.on').dataset.mode === 'raw';
      let cookie;
      if (isRaw) {
        cookie = (overlay.querySelector('[data-name=cookie]').value || '').trim();
      } else {
        const obj = {};
        overlay.querySelectorAll('[data-ck]').forEach(el => {
          if (el.value.trim()) obj[el.dataset.ck] = el.value.trim();
        });
        cookie = joinCookieObj(obj);
      }
      if (!cookie) return { error: 'La cookie no puede estar vacía' };
      if (!cookie.includes('SAPISID')) return { error: 'No hay SAPISID en la cookie; seguramente no se copió completa' };
      return { label, cookie, note };
    },
  });
  if (!data) return;
  const r = await fetch('api/cookies', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data),
  });
  const j = await r.json();
  if (j.error) return flash('Fallo al importar: ' + j.error);
  flash('Cookie importada #' + j.id);
  await refreshPage();
}

// Comprueba si la cookie sigue teniendo sesión. El criterio es si la página /app contiene SNlM0e: cuando la cookie deja de ser válida,
// Gemini no da error, solo te trata como anónimo, y una petición de solo texto sigue devolviendo 200, así que no se puede usar "la petición tuvo éxito" como criterio.
async function checkCookieAcct(id, btn) {
  const old = btn.textContent;
  btn.textContent = 'Comprobando…'; btn.disabled = true;
  try {
    const r = await fetch('api/cookies/' + id + '/check',
      { method: 'POST', credentials: 'include' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { flash('Fallo en la comprobación: ' + (d.error || r.status)); return; }
    const via = d.proxy_name ? `, salida ${d.proxy_name}` : '';
    flash((d.ok ? '✓ #' + id + ' ' : '✗ #' + id + ' ') + (d.detail || '') +
          `${via}, ${d.took_ms}ms`);
    await refreshPage();
  } finally {
    btn.textContent = old; btn.disabled = false;
  }
}

// Dispara manualmente un keep-alive de la sesión (renueva 1PSIDTS + SIDCC). En segundo plano se ejecuta por primera vez 15 segundos después del arranque y luego cada 10 minutos.
async function rotateCookieAcct(id, btn) {
  const old = btn.textContent;
  btn.textContent = '…'; btn.disabled = true;
  try {
    const r = await fetch('api/cookies/' + id + '/rotate',
      { method: 'POST', credentials: 'include' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { flash('Fallo en el keep-alive: ' + (d.error || r.status)); return; }
    flash((d.ok ? '✓ #' + id + ' ' : '✗ #' + id + ' ') + (d.detail || '') +
          (d.next_sec ? `, el servidor sugiere reintentar en ${d.next_sec}s` : ''));
    await refreshPage();
  } finally { btn.textContent = old; btn.disabled = false; }
}

// PersonalizadaDiálogos modales ──────────────────────────────────────────────────────────────
//   modalConfirm({ title, desc, confirmText, danger })       -> bool
//   modalPrompt({ title, desc, label, placeholder, value })   -> string|null
//   modalForm({ title, desc, fields: [{name,label,...}], submitText })
//                                                            -> obj|null

function buildModal({ title, desc, bodyHTML, submitText, danger, wide, allowEnter, onReady, onSubmit }) {
  return new Promise(resolve => {
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay';
    overlay.innerHTML = `
      <div class="modal${wide ? ' wide' : ''}" role="dialog" aria-modal="true">
        ${title ? `<h3>${escapeHtml(title)}</h3>` : ''}
        ${desc ? `<div class="desc">${desc}</div>` : ''}
        <div class="modal-err" style="display:none;"></div>
        <div class="modal-body">${bodyHTML || ''}</div>
        <div class="actions">
          <button class="btn muted" data-act="cancel">Cancelar</button>
          <button class="btn ${danger ? 'danger' : ''}" data-act="ok">${escapeHtml(submitText || 'Aceptar')}</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    // El diálogo se entrega a quien lo llama para enganchar eventos solo después de montarlo en el DOM; el contenido se inyecta con innerHTML,
    // y antes de este paso no se pueden obtener los nodos de dentro.
    if (onReady) onReady(overlay);

    const finish = (val) => {
      overlay.remove();
      document.removeEventListener('keydown', keyHandler);
      resolve(val);
    };
    const showErr = (msg) => {
      const e = overlay.querySelector('.modal-err');
      e.textContent = msg;
      e.style.display = msg ? 'block' : 'none';
      e.className = 'modal-err err';
    };

    overlay.querySelector('[data-act=cancel]').onclick = () => finish(null);
    overlay.querySelector('[data-act=ok]').onclick = async () => {
      const result = onSubmit ? await onSubmit(overlay) : true;
      if (result === false) return; // validation failed
      if (result && typeof result === 'object' && result.error) { showErr(result.error); return; }
      finish(result === true ? true : result);
    };
    overlay.onclick = (e) => { if (e.target === overlay) finish(null); };

    const keyHandler = (e) => {
      if (e.key === 'Escape') finish(null);
      if (e.key === 'Enter' && allowEnter && document.activeElement.tagName !== 'TEXTAREA') {
        overlay.querySelector('[data-act=ok]').click();
      }
    };
    document.addEventListener('keydown', keyHandler);

    // Enfoca automáticamente el primer input
    setTimeout(() => {
      const first = overlay.querySelector('input,textarea');
      if (first) first.focus();
    }, 50);
  });
}

function modalConfirm({ title, desc, confirmText = 'Aceptar', danger = false }) {
  return buildModal({
    title, desc, bodyHTML: '', submitText: confirmText, danger, allowEnter: true,
    onSubmit: () => true,
  });
}

function modalPrompt({ title, desc, label, placeholder = '', value = '', hint, password = false }) {
  return buildModal({
    title, desc, allowEnter: true,
    bodyHTML: `<div class="field">
      ${label ? `<label>${escapeHtml(label)}</label>` : ''}
      <input type="${password ? 'password' : 'text'}" placeholder="${escapeHtml(placeholder)}" value="${escapeHtml(value)}" />
      ${hint ? `<div class="hint">${hint}</div>` : ''}
    </div>`,
    submitText: 'Aceptar',
    onSubmit: (overlay) => {
      const v = overlay.querySelector('input').value;
      if (!v) return { error: 'No puede estar vacío' };
      return v;
    },
  });
}

// fields: [{ name, label, placeholder, hint, value, required, password }]
function modalForm({ title, desc, fields, submitText = 'Enviar' }) {
  const html = fields.map(f => `
    <div class="field">
      <label>${escapeHtml(f.label)}${f.required ? ' *' : ''}</label>
      <input data-name="${escapeHtml(f.name)}" type="${f.password ? 'password' : 'text'}"
             placeholder="${escapeHtml(f.placeholder || '')}"
             value="${escapeHtml(f.value || '')}" />
      ${f.hint ? `<div class="hint">${f.hint}</div>` : ''}
    </div>`).join('');
  return buildModal({
    title, desc, bodyHTML: html, submitText, allowEnter: true,
    onSubmit: (overlay) => {
      const out = {};
      for (const f of fields) {
        const el = overlay.querySelector(`[data-name="${f.name}"]`);
        const v = (el.value || '').trim();
        if (f.required && !v) return { error: `«${f.label}» no puede estar vacío` };
        if (f.minLength && v.length < f.minLength) return { error: `«${f.label}» debe tener al menos ${f.minLength} caracteres` };
        out[f.name] = v;
      }
      return out;
    },
  });
}

let currentPage = null;
let pageSeq = 0;

// Pulsar un elemento de navegación ya seleccionado se ignora directamente: volver a traer los datos y repintar todo igual solo hace
// que el usuario vea un parpadeo. Para recargar los datos está el botón «Actualizar», que usa refreshPage().
async function switchPage(name, force = false) {
  if (!force && name === currentPage) return;
  const seq = ++pageSeq;
  currentPage = name;

  document.querySelectorAll('nav button').forEach(b =>
    b.classList.toggle('active', b.dataset.page === name));
  const titleEl = document.getElementById('pageTitle');
  if (titleEl) titleEl.textContent = PAGE_TITLES[name] || name;
  const main = document.getElementById('main');

  // El contenido antiguo se mantiene; solo se muestra el marcador de posición si tarda más de 200ms — cuando va rápido no parpadea nada
  const slow = setTimeout(() => {
    if (seq === pageSeq) main.innerHTML = '<div class="empty">Cargando…</div>';
  }, 200);
  let html;
  try {
    html = await pages[name]();
  } catch (e) {
    clearTimeout(slow);
    if (seq === pageSeq) main.innerHTML = '<div class="empty">' + e.message + '</div>';
    return;
  }
  clearTimeout(slow);
  if (seq !== pageSeq) return;   // Se pulsó otra página mientras tanto; se descarta este resultado
  main.innerHTML = html;

  if (name === 'dashboard') {
    await loadChart('24h');
    document.getElementById('rangeSel').onchange = (e) => loadChart(e.target.value);
    await populateTestProxies();
  }
  if (name === 'requests') {
    reqOffset = 0;
    document.getElementById('reqStatus').onchange = () => { reqOffset = 0; loadReqs(); };
    document.getElementById('reqModel').onchange = () => { reqOffset = 0; loadReqs(); };
    document.getElementById('reqSize').onchange = () => { reqOffset = 0; loadReqs(); };
    await loadReqs();
  }
  if (name === 'settings') {
    await loadRtCfg();
  }
}

// Vuelve a traer los datos de la página actual (botón «Actualizar», recarga tras crear/editar/borrar)
function refreshPage() { return switchPage(currentPage, true); }

}

// En la parte inferior de la barra lateral se pone un estado de servicio realmente útil, no un guion de relleno
async function loadSideStat() {
  const box = document.getElementById('sideStat');
  if (!box) return;
  try {
    const [root, ck, usage] = await Promise.all([
      fetch('../').then(r => r.json()).catch(() => null),
      api('api/cookies').catch(() => null),
      api('api/usage').catch(() => null),
    ]);
    const dot = document.getElementById('healthDot');
    const ht = document.getElementById('healthText');
    if (dot) dot.classList.toggle('bad', !root);
    if (ht) ht.textContent = root ? 'En ejecución' : 'Sin conexión';
    box.innerHTML = [
      ['Versión', root ? 'v' + root.version : '—'],
      ['Modelo', root ? root.models.length + ' modelos' : '—'],
      ['Cookie', ck && ck.items && ck.items.length ? ck.items.length + ' cuentas' : 'Anónimo'],
      ['IP slot', usage ? (usage.items || []).length + ' sl' : '—'],
    ].map(([k, v]) => `<div class="sf-row"><span>${k}</span><b>${v}</b></div>`).join('');
  } catch (e) { box.innerHTML = ''; }
}

function renderLogin() {
  document.getElementById('app').innerHTML = `
    <div class="login-box">
      <h1><span class="spark" style="width:20px;height:20px;background:var(--g-sweep);
        border-radius:4px;display:inline-block;
        clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%)"></span>
        gemini-web2api</h1>
      <input id="tokenInput" type="password" placeholder="Token de administración" />
      <button class="btn" onclick="doLogin()">Iniciar sesión</button>
      <div id="loginErr" class="err"></div>
    </div>`;
  document.getElementById('tokenInput').focus();
  document.getElementById('tokenInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });
}

async function doLogin() {
  const tok = document.getElementById('tokenInput').value;
  const r = await fetch('api/login', { method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token: tok }) });
  if (r.ok) renderShell();
  else document.getElementById('loginErr').textContent = 'Token incorrecto';
}

let LANG = (() => { try { return localStorage.getItem('lang') === 'en' ? 'en' : 'es'; } catch (e) { return 'es'; } })();
const ES_ORIG = new WeakMap();
const I18N_ATTRS = ['title', 'placeholder', 'aria-label'];

function translateTree(root, toEN) {
  // Normaliza: trim + convierte saltos de línea e indentación internos en un solo espacio, para que cuadren exactamente con las claves del diccionario (una frase
  // repartida en varias líneas del código es un nodo de texto con saltos de línea e indentación en el DOM). Si coincide, se sustituye el bloque entero por inglés y se guarda el original para volver atrás.
  const norm = s => s.trim().replace(/\s+/g, ' ');
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = w.nextNode())) {
    const key = norm(n.nodeValue);
    if (!key) continue;
    if (toEN) {
      const en = I18N_EN[key];
      if (en) {
        if (!ES_ORIG.has(n)) ES_ORIG.set(n, n.nodeValue);
        n.nodeValue = en;
      }
    } else if (ES_ORIG.has(n)) {
      n.nodeValue = ES_ORIG.get(n);
      ES_ORIG.delete(n);
    }
  }
  const scope = root.querySelectorAll ? root.querySelectorAll('[title],[placeholder],[aria-label]') : [];
  scope.forEach(el => {
    I18N_ATTRS.forEach(attr => {
      if (!el.hasAttribute(attr)) return;
      const dz = 'data-es-' + attr;
      if (toEN) {
        const en = I18N_EN[norm(el.getAttribute(attr))];
        if (en && !el.hasAttribute(dz)) { el.setAttribute(dz, el.getAttribute(attr)); el.setAttribute(attr, en); }
      } else if (el.hasAttribute(dz)) {
        el.setAttribute(attr, el.getAttribute(dz)); el.removeAttribute(dz);
      }
    });
  });
}

let i18nObserver = null;
let i18nPending = false;
function i18nApply() {
  const app = document.getElementById('app');
  if (!app) return;
  if (i18nObserver) i18nObserver.disconnect();
  translateTree(app, LANG === 'en');
  if (i18nObserver) i18nObserver.observe(app, { childList: true, subtree: true, characterData: true });
}
function i18nSchedule() {
  if (i18nPending || LANG !== 'en') return;
  i18nPending = true;
  requestAnimationFrame(() => { i18nPending = false; i18nApply(); });
}
function i18nInit() {
  const app = document.getElementById('app');
  if (!app) return;
  i18nObserver = new MutationObserver(() => i18nSchedule());
  i18nObserver.observe(app, { childList: true, subtree: true, characterData: true });
  updateLangBtn();
  if (LANG === 'en') i18nApply();
}
function updateLangBtn() {
  const b = document.getElementById('langBtn');
  if (b) b.textContent = LANG === 'en' ? 'ES' : 'EN';
}
function toggleLang() {
  LANG = LANG === 'en' ? 'es' : 'en';
  try { localStorage.setItem('lang', LANG); } catch (e) {}
  i18nApply();
  updateLangBtn();
}
