name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # Crear el Release y subir adjuntos requiere permiso de escritura

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Si el tag y la constante Version del código no coinciden, falla directamente.
      # De lo contrario se publicaría un paquete v4.0.1 cuyo --version imprime 4.0.0,
      # y ese tipo de error solo se descubre cuando un usuario lo reporta.
      - name: Check tag matches Version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Usamos sed y no grep -oP: -P depende de PCRE y directamente falla en locales no UTF-8
          code=$(sed -n 's/^const Version = "\(.*\)"$/\1/p' internal/app/server.go)
          echo "tag=$tag  internal/app/server.go=$code"
          [ "$tag" = "$code" ] || { echo "::error::el tag $tag no coincide con $code en internal/app/server.go"; exit 1; }

      - run: go test ./...

      # CGO_ENABLED=0: SQLite usa modernc.org/sqlite (Go puro),
      # así que la compilación cruzada no necesita la cadena de herramientas C de cada
      # plataforma, con GOOS/GOARCH es suficiente.
      - name: Cross compile
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          ver="${GITHUB_REF_NAME}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="dist/gemini-web2api-go_${ver}_${os}_${arch}"
            [ "$os" = "windows" ] && bin="$out.exe" || bin="$out"
            echo "building $bin"
            GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "$bin" .
          done
          cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      # Extrae de CHANGELOG.md la sección correspondiente a este tag y la integra en las
      # notas del Release.
      # Método: desde la línea siguiente a `## <número de versión>` hasta antes del
      # siguiente `## `.
      # Si no se encuentra (no hay CHANGELOG) se deja vacío, y se cubre con la lista de
      # commits de generate_release_notes de abajo.
      - name: Build release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver="${GITHUB_REF_NAME#v}"
          {
            echo "Binario único: descarga el de tu plataforma y ejecútalo directamente, no necesitas Go ni Docker:"
            echo
            echo '```bash'
            echo 'chmod +x gemini-web2api-go_*'
            echo './gemini-web2api-go_* --port 8083 --admin-token your-admin-token'
            echo '```'
            echo
            echo "Para el despliegue en contenedor, consulta \`ghcr.io/${{ github.repository }}\`. Para verificar la integridad usa \`SHA256SUMS.txt\`."
            section=$(awk -v v="$ver" '$0=="## "v{f=1;next} /^## /{f=0} f' CHANGELOG.md)
            if [ -n "$section" ]; then
              echo
              echo "## Novedades de esta versión"
              echo "$section"
            fi
          } > release_body.md
          cat release_body.md

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: dist/*
          generate_release_notes: true
          body_path: release_body.md
