services:
  gemini-web2api:
    # Por defecto descarga una imagen ya lista, sin necesidad del código fuente: basta
    # con bajar este archivo por separado y ya se puede ejecutar.
    # Si quieres construir desde el código fuente (modificaste código o quieres
    # auditarlo tú mismo) descomenta las dos líneas "build" de abajo.
    image: ghcr.io/zexadev/gemini-web2api-go:latest
    # build:
    #   context: .
    container_name: gemini-web2api
    restart: unless-stopped

    # ── Aquí solo va lo que "al cambiarlo obliga a reiniciar el proceso" ──────
    # Los parámetros de ajuste (cuotas de rate limit, reintentos, timeouts, modelo
    # por defecto, huella TLS, versión de bl, interruptores de degradación,
    # interruptor de logs, días de retención) se cambian en el panel de
    # administración, en «Configuración → Configuración en ejecución», y se aplican
    # al guardar.
    # Las credenciales (API Key, cookie de Google) también se gestionan en el panel
    # y se guardan en la base de datos.
    # Los montajes API_KEY / cookie de abajo son **interruptores de bloqueo
    # opcionales**, para despliegues que no quieran que se cambien en ejecución; si
    # no se definen, por defecto se usa el panel.

    ports:
      - "127.0.0.1:8083:8083"
    # Para exponerlo a otros contenedores de la misma red de docker (sin salir a
    # la red pública), usa en su lugar:
    # expose:
    #   - "8083"
    # y luego haz que los otros contenedores se unan a la red default de abajo o a
    # una red personalizada.

    volumes:
      # Usa un volumen con nombre en lugar de ./data:/data — la imagen se ejecuta
      # como nonroot (uid 65532), y un bind mount sobrescribiría el propietario de
      # /data de la imagen con el propietario del directorio del host. Cuando el
      # directorio no existe en el host, Docker lo crea con propietario root y el
      # contenedor no puede escribir, dando el error
      # `unable to open database file (14)`.
      # Un volumen con nombre hereda el propietario de la imagen, así que no cae en
      # esta trampa.
      - gw2a-data:/data                           # Persistencia de SQLite + historial
      # Si aun así necesitas un bind mount, cambia antes el propietario:
      # sudo chown -R 65532:65532 ./data
      # - ./data:/data
      # - ./cookie.txt:/app/cookie.txt:ro         # Opcional: importa este archivo al pool de cookies al iniciar

    environment:
      # Token de inicio de sesión del panel. Vacío = el panel no autentica, solo
      # aceptable cuando se escucha en 127.0.0.1.
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-in-production}"
      # Opcional: fija la API key de /v1/*; una vez definida el panel no la puede
      # cambiar.
      # Si no se define, se genera automáticamente en el primer arranque y se rota
      # desde el panel.
      # API_KEY: "sk-gemini-your-key"
      TZ: "${TZ:-UTC}"

    # La imagen ya trae CMD ["--db","/data/gemini.db","--port","8083"], normalmente
    # no hace falta cambiarlo.
    # Solo escribe command si necesitas añadir parámetros; al escribirlo sobrescribe
    # por completo el valor por defecto, no olvides --db.
    # command: ["--db", "/data/gemini.db", "--port", "8083", "--cookie-file", "/app/cookie.txt"]

    healthcheck:
      test: ["CMD", "/app/gemini-web2api", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gw2a-data:
